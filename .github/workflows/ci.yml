name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, build, CLI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: agent-eval runs end to end (offline example)
        run: npm run eval -- --min-pass-rate 0 -o /dev/null packages/agent-eval/examples/command.eval.json

  webmcp:
    name: WebMCP contract suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:webmcp

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: webmcp-playwright-report
          path: e2e/webmcp-contract/playwright-report/
          retention-days: 14
